<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INJECTOR TEST NODE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-purple: #bc13fe;
            --black-bloom: #050505;
        }
        body { background: var(--black-bloom); color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .terminal-container { width: 90%; max-width: 500px; background: rgba(10, 10, 15, 0.9); border: 1px solid var(--neon-cyan); padding: 20px; border-radius: 8px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); text-align: center; }
        .terminal-header { color: var(--neon-cyan); font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; }
        
        .input-matrix { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .input-matrix input { background: rgba(0,0,0,0.6); border: 1px solid rgba(0,255,255,0.3); padding: 12px; color: #fff; border-radius: 4px; text-align: center; }
        
        .gateway-matrix { display: flex; gap: 10px; }
        .cyber-btn { flex: 1; padding: 12px; border: none; cursor: pointer; text-transform: uppercase; font-weight: bold; border-radius: 4px; transition: 0.3s; }
        .stripe-btn { border: 1px solid var(--neon-cyan); background: transparent; color: var(--neon-cyan); }
        .stripe-btn:hover { background: var(--neon-cyan); color: #000; }
        .crypto-btn { border: 1px solid var(--neon-purple); background: transparent; color: var(--neon-purple); }
        .crypto-btn:hover { background: var(--neon-purple); color: #000; }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="terminal-header">INJECTOR TEST NODE</div>
        <div class="input-matrix">
            <input type="text" id="newLinkName" placeholder="PLATFORM DESIGNATION">
            <input type="url" id="newLinkUrl" placeholder="HTTPS://...">
        </div>
        <div class="gateway-matrix">
            <button class="cyber-btn stripe-btn" onclick="processGateway('stripe')">
                <i class="fa-brands fa-stripe-s"></i> STRIPE
            </button>
            <button class="cyber-btn crypto-btn" onclick="processGateway('crypto')">
                <i class="fa-brands fa-bitcoin"></i> CRYPTO
            </button>
        </div>
    </div>

    <script>
        async function processGateway(gateway) {
            const nameInput = document.getElementById('newLinkName').value.trim();
            const urlInput = document.getElementById('newLinkUrl').value.trim();
            
            if (!nameInput || !urlInput) return alert("⚠️ MULTIVERSE ERROR: Designation and Protocol required.");
            
            try { new URL(urlInput); } catch (e) { return alert("⚠️ Invalid URL. Must include https://"); }

            const encodedName = encodeURIComponent(nameInput);
            const encodedUrl = encodeURIComponent(urlInput);
            
            if (gateway === 'stripe') {
                const stripeBase = "https://buy.stripe.com/eVqaEWeI74KEddqbhgcIE03";
                window.open(`${stripeBase}?prefilled_custom_field_value[0]=${encodedName}&prefilled_custom_field_value[1]=${encodedUrl}`, '_blank');
            } else if (gateway === 'crypto') {
                const cryptoBase = "https://nowpayments.io/payment/?iid=5817172284";
                window.open(`${cryptoBase}&order_id=${encodedName}&order_description=${encodedUrl}`, '_blank');
            }
            
            document.getElementById('newLinkName').value = '';
            document.getElementById('newLinkUrl').value = '';
        }
    </script>
</body>
</html>
