<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OLYMPUS | GRAND MULTIVERSE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --neon-cyan: #00ffff;
            --neon-purple: #bc13fe;
            --black-bloom: #050505;
            --glow: 0 0 20px rgba(0,255,255,0.4);
            --transition: all 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }

        body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background: var(--black-bloom); font-family: 'Segoe UI', sans-serif; color: #fff; }

        /* GALAXY CANVAS */
        canvas { position: fixed; top: 0; left: 0; z-index: 1; display:block; touch-action:none; }

        /* UI MASTER TOGGLE */
        .ui-master { position: fixed; inset: 0; opacity: 1; transition: var(--transition); pointer-events: all; z-index: 2; display: flex; flex-direction: column; }
        .ui-hidden { opacity: 0 !important; pointer-events: none !important; transform: scale(1.02); filter: blur(8px); }

        /* NAVIGATION */
        .nav-header {
            padding: 20px; display: flex; align-items: center; gap: 15px; z-index: 3000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .menu-btn {
            width: 50px; height: 50px; flex-shrink: 0; background: rgba(0,0,0,0.8);
            border: 1.5px solid var(--neon-cyan); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--neon-cyan); font-size: 1.2rem; cursor: pointer; box-shadow: var(--glow);
        }

        .search-container { flex-grow: 1; max-width: 600px; margin: 0 auto; }
        #mallSearch {
            width: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            border: 1.5px solid rgba(0,255,255,0.3); padding: 12px 25px;
            border-radius: 30px; color: #fff; outline: none; box-shadow: var(--glow);
            font-size: 0.9rem; box-sizing: border-box; transition: 0.3s;
        }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(30px);
            border-right: 1px solid var(--neon-cyan); z-index: 4000;
            transition: var(--transition); padding: 100px 0 50px 0; overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .menu-link {
            padding: 16px 30px; display: block; color: #aaa; text-decoration: none;
            text-transform: uppercase; letter-spacing: 2px; font-size: 0.7rem;
            border-bottom: 1px solid rgba(0,255,255,0.05); transition: 0.3s; cursor: pointer;
        }
        .menu-link:hover, .menu-link.active-link { color: var(--neon-cyan); background: rgba(0,255,255,0.05); padding-left: 40px; border-left: 3px solid var(--neon-cyan); }

        /* VIEWPORT & GRID */
        .viewport {
            flex-grow: 1; overflow-y: auto; padding: 20px 20px 150px; /* Extra bottom padding for FAB overlap prevention */
            display: flex; flex-direction: column; align-items: center;
            scrollbar-width: none; cursor: crosshair;
        }
        .viewport::-webkit-scrollbar { display: none; }

        .cat-banner {
            color: var(--neon-cyan); letter-spacing: 12px; font-weight: 900;
            text-transform: uppercase; margin-bottom: 50px; text-shadow: var(--glow);
            text-align: center; font-size: 1.5rem; pointer-events: none;
        }

        .icon-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px; width: 100%; max-width: 1500px; pointer-events: none;
        }

        /* HOLOGRAM CARDS */
        .hologram-card {
            background: rgba(15, 15, 20, 0.7); backdrop-filter: blur(12px);
            border: 1px solid rgba(0,255,255,0.15); border-radius: 15px;
            text-decoration: none; overflow: hidden; transition: 0.4s;
            display: flex; flex-direction: column; pointer-events: auto;
            cursor: pointer; position: relative;
        }
        .hologram-card:hover {
            transform: translateY(-8px); border-color: var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0,255,255,0.4);
        }
        .video-box { width: 100%; height: 110px; background: #000; position: relative; }
        .masked-video { width: 100%; height: 100%; object-fit: cover; opacity: 0.6; }
        .label {
            padding: 15px; color: #fff; font-size: 0.7rem; text-align: center;
            letter-spacing: 1.5px; text-transform: uppercase; font-weight: bold;
        }

        /* FLOATING SEARCH FAB - STEP 3 IMPLEMENTATION */
        .fab-search-container {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; align-items: center; gap: 10px; z-index: 6000;
            transition: var(--transition);
        }
        .fab-trigger {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--black-bloom); border: 2px solid var(--neon-cyan);
            box-shadow: var(--glow); color: var(--neon-cyan);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; cursor: pointer; transition: 0.3s;
        }
        .fab-trigger:hover { border-color: var(--neon-purple); box-shadow: 0 0 25px var(--neon-purple); color: var(--neon-purple); transform: scale(1.1); }
        
        .fab-input {
            width: 0; opacity: 0; height: 50px; border-radius: 25px;
            border: 1.5px solid var(--neon-cyan); background: rgba(0,0,0,0.9);
            color: white; padding: 0; transition: all 0.4s ease;
            outline: none; backdrop-filter: blur(10px);
        }
        .fab-search-container.active .fab-input { width: 250px; opacity: 1; padding: 0 20px; }

        #obs-hint {
            position: fixed; bottom: 10px; width: 100%; text-align: center;
            color: rgba(0,255,255,0.4); font-size: 0.6rem; letter-spacing: 3px;
            text-transform: uppercase; pointer-events: none; z-index: 5000;
        }
    </style>
</head>
<body>

    <div id="obs-hint">Click background to toggle Observation Mode</div>

    <canvas id="galaxy-canvas"></canvas>

    <div class="fab-search-container" id="fabSearchCont">
        <input type="text" id="fabInput" class="fab-input" placeholder="SCAN THE MULTIVERSE..." onkeyup="syncSearch(this.value)">
        <div class="fab-trigger" onclick="toggleFabSearch()"><i class="fa-solid fa-magnifying-glass"></i></div>
    </div>

    <div id="ui-master" class="ui-master">
        <header class="nav-header" id="nav-header">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
            <div class="search-container">
                <input type="text" id="mallSearch" placeholder="SEARCH ENTIRE DIRECTORY..." onkeyup="syncSearch(this.value)">
            </div>
        </header>

        <nav class="sidebar" id="sidebar"></nav>

        <main class="viewport" id="viewport">
            <div class="cat-banner" id="cat-indicator">Olympus Core</div>
            <div class="icon-grid" id="mallGrid"></div>
        </main>
    </div>

    <script type="importmap">
        {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 1, 10000);
        const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('galaxy-canvas'), antialias:true, alpha:true});
        renderer.setSize(window.innerWidth, window.innerHeight);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;

        const starGeo = new THREE.BufferGeometry();
        const starVerts = [];
        for (let i = 0; i < 20000; i++) {
            starVerts.push(THREE.MathUtils.randFloatSpread(5000), THREE.MathUtils.randFloatSpread(5000), THREE.MathUtils.randFloatSpread(5000));
        }
        starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
        const starMat = new THREE.PointsMaterial({ color: 0x00ffff, size: 1.5, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starGeo, starMat));

        const centralStar = new THREE.Mesh(new THREE.SphereGeometry(50, 32, 32), new THREE.MeshStandardMaterial({color: 0xbc13fe, emissive: 0xbc13fe, emissiveIntensity: 3}));
        scene.add(centralStar);
        scene.add(new THREE.PointLight(0xbc13fe, 5, 3000));
        
        camera.position.z = 1500;

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // IMMERSIVE TOGGLE
        const uiMaster = document.getElementById('ui-master');
        const fabSearch = document.getElementById('fabSearchCont');
        const viewport = document.getElementById('viewport');
        const canvas = document.getElementById('galaxy-canvas');

        viewport.addEventListener('click', (e) => { if (e.target === viewport) toggleUI(false); });
        canvas.addEventListener('click', () => toggleUI(true));

        function toggleUI(show) {
            if(show) {
                uiMaster.classList.remove('ui-hidden');
                fabSearch.classList.remove('ui-hidden');
            } else {
                uiMaster.classList.add('ui-hidden');
                fabSearch.classList.add('ui-hidden');
            }
        }
    </script>

    <script>
        const categories = [
            { id: 'core', name: 'Multiverse Core' },
            { id: 'featured', name: 'Olympus Featured Realms' },
            { id: 'renewed', name: 'A Renewed World' },
            { id: 'mining', name: 'Industrial Mining & Oil' },
            { id: 'tech', name: 'The Tech Stack' },
            { id: 'apparel', name: 'Elite Apparel' },
            { id: 'finance', name: 'Crypto & Fintech' },
            { id: 'kids', name: 'Kids Zone' }
        ];

        const linkData = {
            core: [
                {n: "Olympus Core", u: "https://nexusvortex.ca"},
                {n: "Artemis OS", u: "https://artemis-os.vercel.app/"},
                {n: "Save the Citizen", u: "https://save-the-citizen.vercel.app/"}
            ],
            featured: [
                {n: "REM-PSI Mauve", u: "https://rem-psi-mauve.vercel.app/"},
                {n: "Aethelgard Five", u: "https://aethelgard-five.vercel.app/"},
                {n: "Neon Racer Ecru", u: "https://neon-racer-ecru.vercel.app/"},
                {n: "Grief Gully", u: "https://grief-gully.vercel.app/"}
            ],
            mining: [
                {n: "Oil & Gas Portal", u: "#"},
                {n: "BlockDAG Mining", u: "https://blockdag.network"},
                {n: "Nexus Logistics", u: "#"}
            ],
            tech: [
                {n: "GitHub", u: "https://github.com"},
                {n: "Three.js Journey", u: "https://threejs-journey.com"},
                {n: "Vercel Build", u: "https://vercel.com"}
            ],
            apparel: [
                {n: "Elite Apparel Store", u: "#"},
                {n: "Cyberpunk Streetwear", u: "#"}
            ],
            finance: [
                {n: "Wealthsimple", u: "https://www.wealthsimple.com"},
                {n: "Binance Terminal", u: "https://www.binance.com"}
            ],
            kids: [
                {n: "Rock & Mineral Discovery", u: "https://kids.nationalgeographic.com/science/article/rocks-and-minerals"},
                {n: "Peppa Pig Official", u: "https://peppapig.com"}
            ]
        };

        const vidUrl = "https://files.catbox.moe/qnb2fw.mp4";

        function renderSidebar() {
            const sb = document.getElementById('sidebar');
            categories.forEach(cat => {
                sb.innerHTML += `<a class="menu-link" id="link-${cat.id}" onclick="showSection('${cat.id}')">${cat.name}</a>`;
            });
        }

        function showSection(id) {
            const grid = document.getElementById('mallGrid');
            const indicator = document.getElementById('cat-indicator');
            document.querySelectorAll('.menu-link').forEach(el => el.classList.remove('active-link'));
            document.getElementById(`link-${id}`)?.classList.add('active-link');

            indicator.innerText = categories.find(c => c.id === id)?.name || id;
            grid.innerHTML = '';
            (linkData[id] || []).forEach(item => {
                grid.innerHTML += `
                <a href="${item.u}" target="_blank" class="hologram-card">
                    <div class="video-box"><video class="masked-video" muted loop playsinline autoplay><source src="${vidUrl}" type="video/mp4"></video></div>
                    <div class="label">${item.n}</div>
                </a>`;
            });
            if(window.innerWidth < 1100) document.getElementById('sidebar').classList.remove('active');
        }

        function syncSearch(val) {
            const mainSearch = document.getElementById('mallSearch');
            const fabInput = document.getElementById('fabInput');
            mainSearch.value = val;
            fabInput.value = val;
            
            const query = val.toLowerCase();
            const grid = document.getElementById('mallGrid');
            if(query.length > 0) {
                grid.innerHTML = '';
                Object.values(linkData).flat().forEach(item => {
                    if(item.n.toLowerCase().includes(query)) {
                        grid.innerHTML += `
                        <a href="${item.u}" target="_blank" class="hologram-card">
                            <div class="video-box"><video class="masked-video" muted loop playsinline autoplay><source src="${vidUrl}" type="video/mp4"></video></div>
                            <div class="label">${item.n}</div>
                        </a>`;
                    }
                });
            } else { showSection('core'); }
        }

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }
        function toggleFabSearch() { document.getElementById('fabSearchCont').classList.toggle('active'); if(document.getElementById('fabSearchCont').classList.contains('active')) document.getElementById('fabInput').focus(); }

        window.onload = () => { renderSidebar(); showSection('core'); };
    </script>
</body>
</html>
