<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Vortex | Digital Mall & Directory</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-purple: #bc13fe;
            --dark-bg: #050505;
            --glass: rgba(0, 255, 255, 0.1);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--dark-bg);
            font-family: var(--font-main);
            color: white;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- Layout Structure --- */
        .ui-wrapper {
            position: relative;
            z-index: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 40px 0;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        header h1 {
            font-size: 3rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 20px var(--neon-cyan);
            margin: 0;
        }

        /* --- Grid & Cards --- */
        .mall-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1400px;
            /* Collision Avoidance for Search FAB */
            padding-bottom: 120px; 
            padding-right: 10px;
        }

        .hologram-card {
            background: var(--glass);
            border: 1px solid var(--neon-cyan);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: white;
        }

        .hologram-card:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 25px var(--neon-purple);
            transform: translateY(-5px);
        }

        .hologram-card h3 {
            margin-top: 0;
            color: var(--neon-cyan);
            font-size: 1.2rem;
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding-bottom: 10px;
        }

        .hologram-card p {
            font-size: 0.9rem;
            line-height: 1.4;
            opacity: 0.8;
        }

        .tag {
            font-size: 0.7rem;
            background: rgba(188, 19, 254, 0.2);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--neon-purple);
            float: right;
        }

        /* --- Floating Search FAB --- */
        .floating-search {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10000;
        }

        .search-button {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: var(--dark-bg);
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
            cursor: pointer;
            color: var(--neon-cyan);
            font-size: 1.8rem;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .search-button:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 25px var(--neon-purple);
            color: var(--neon-purple);
            transform: scale(1.1) rotate(10deg);
        }

        .search-field {
            width: 0;
            opacity: 0;
            height: 50px;
            border-radius: 25px;
            border: 1px solid var(--neon-cyan);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0;
            outline: none;
            transition: all 0.4s ease;
            backdrop-filter: blur(15px);
            font-size: 1rem;
        }

        .floating-search.active .search-field {
            width: 300px;
            opacity: 1;
            padding: 0 25px;
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .floating-search.active .search-field { width: 200px; }
            header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="ui-wrapper">
    <header>
        <h1>Nexus Vortex</h1>
        <p>Omni-Channel Digital Mall & Multiverse Directory</p>
    </header>

    <div class="mall-grid" id="mall-grid">
        </div>
</div>

<div id="search-container" class="floating-search">
    <input type="text" id="search-input" placeholder="Scan the sectors..." class="search-field">
    <button id="search-trigger" class="search-button">
        <span>🔍</span>
    </button>
</div>

<script>
    /* --- 1. THE DATA (All Categories) --- */
    const sectors = [
        { title: "Multiverse Core", desc: "Central hub for all dimensional data and core site navigation.", tag: "System" },
        { title: "Olympus Featured", desc: "Premium realms and high-traffic portals within the Vortex.", tag: "Priority" },
        { title: "Apparel Sector", desc: "Nexus-branded garments and futuristic streetwear.", tag: "Retail" },
        { title: "Tech Stack", desc: "Three.js, WebGL, and Blockchain infrastructure tools.", tag: "Dev" },
        { title: "A Renewed World", desc: "Environmental data and sustainability initiatives.", tag: "Eco" },
        { title: "Afterlife & Beyond", desc: "Spiritual archives and digital consciousness research.", tag: "Deep" },
        { title: "Abyssal Aquatic", desc: "Oceanic data and underwater digital environments.", tag: "Research" },
        { title: "Jewelry & Horology", desc: "Exquisite timepieces and digital accessories.", tag: "Luxury" },
        { title: "Mining & Energy", desc: "Real-time stats for crypto mining and oil/gas logistics.", tag: "Industry" }
    ];

    /* --- 2. THE THREE.JS STARFIELD --- */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Stars
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0x00f3ff, size: 0.7 });
    const starVertices = [];
    for (let i = 0; i < 15000; i++) {
        const x = (Math.random() - 0.5) * 2000;
        const y = (Math.random() - 0.5) * 2000;
        const z = -Math.random() * 2000;
        starVertices.push(x, y, z);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    camera.position.z = 1;

    function animate() {
        requestAnimationFrame(animate);
        stars.rotation.z += 0.0005;
        stars.position.z += 0.5;
        if (stars.position.z > 500) stars.position.z = 0;
        renderer.render(scene, camera);
    }
    animate();

    /* --- 3. UI GENERATION --- */
    const grid = document.getElementById('mall-grid');
    function renderCards(data) {
        grid.innerHTML = '';
        data.forEach(item => {
            const card = document.createElement('div');
            card.className = 'hologram-card';
            card.innerHTML = `
                <span class="tag">${item.tag}</span>
                <h3>${item.title}</h3>
                <p>${item.desc}</p>
            `;
            grid.appendChild(card);
        });
    }
    renderCards(sectors);

    /* --- 4. SEARCH FUNCTIONALITY --- */
    const searchContainer = document.getElementById('search-container');
    const searchTrigger = document.getElementById('search-trigger');
    const searchInput = document.getElementById('search-input');

    searchTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        searchContainer.classList.toggle('active');
        if (searchContainer.classList.contains('active')) searchInput.focus();
    });

    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = sectors.filter(s => 
            s.title.toLowerCase().includes(term) || 
            s.desc.toLowerCase().includes(term) ||
            s.tag.toLowerCase().includes(term)
        );
        renderCards(filtered);
    });

    // Close search if clicking outside
    document.addEventListener('click', (e) => {
        if (!searchContainer.contains(e.target)) {
            searchContainer.classList.remove('active');
        }
    });

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>

</body>
</html>
